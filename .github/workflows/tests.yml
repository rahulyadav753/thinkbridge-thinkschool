name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Quotes API
        run: dotnet restore ./Day-3/QuotesApi/QuotesApi.csproj

      - name: Restore Unit Tests
        run: dotnet restore ./Day-3/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj

      - name: Restore Integration Tests
        run: dotnet restore ./Day-3/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Build
        run: dotnet build ./Day-3/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-restore

      - name: Unit Tests
        run: dotnet test ./Day-3/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-build

      - name: Integration Tests
        run: dotnet test ./Day-3/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-build